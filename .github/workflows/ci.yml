name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          # Provide dummy secrets so imports that read env vars don't fail
          MT5_PASSWORD: dummy
          MT5_PASSWORD_LIVE: dummy
          JWT_SECRET_KEY: dummy-secret-for-ci-only
        run: |
          python -m pytest tests/ -v --tb=short
