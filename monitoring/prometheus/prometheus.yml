scrape_configs:
  - job_name: 'aibot-mt5'
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['localhost:8000']
        labels:
          instance: 'production'
          environment: 'paper'
          
